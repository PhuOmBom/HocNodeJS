<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | BookOnl</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page"><main class="auth-card"><p class="eyebrow">BOOKONL / ACCOUNT</p><h1>Create your account</h1><p class="muted">Start managing your reading profile in a few seconds.</p><form id="registerForm"><label>Full name<input type="text" name="name" required minlength="2" autocomplete="name"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="6" autocomplete="new-password"></label><button class="button" type="submit">Create account</button><p id="formMessage" class="form-message"></p></form><p class="switch-link">Already have an account? <a href="/login">Sign in</a></p></main><script src="/js/main.js"></script></body>
</html>
