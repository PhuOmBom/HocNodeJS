<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard | BookOnl</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="dashboard-page"><header class="site-header"><a class="brand" href="/">BOOK<span>ONL</span></a><a class="text-link" href="/">← Back to store</a></header><main class="dashboard-shell"><p id="dashboardEyebrow" class="eyebrow">DASHBOARD</p><h1 id="dashboardTitle">Loading...</h1><div id="dashboardStats" class="stats-grid"></div><section id="addBookPanel" class="dashboard-panel add-book-panel" hidden><div class="section-heading"><div><p class="eyebrow">SELLER TOOLS</p><h2>Add a book</h2></div></div><form id="addBookForm" class="book-form"><label>Title<input name="title" required placeholder="Book title"></label><label>Author<input name="author" required placeholder="Author name"></label><label>Category<select name="category" id="bookCategory" required></select></label><label>Price<input name="price" type="number" min="0" step="0.01" required placeholder="19.99"></label><label>Stock<input name="stock" type="number" min="0" required placeholder="10"></label><div class="wide-field"><span class="field-label">Book images</span><label id="imageDropzone" class="image-dropzone"><input id="bookImages" type="file" accept="image/png,image/jpeg,image/webp" multiple><span class="drop-icon">↑</span><strong>Drop images here or browse</strong><small>PNG, JPG or WEBP. The first image becomes the cover.</small></label><div id="imagePreview" class="image-preview"></div></div><label class="wide-field">Description<textarea name="description" rows="3" placeholder="Tell readers about this book"></textarea></label><button class="button" type="submit">Publish book</button><p id="bookFormMessage" class="form-message"></p></form></section><section class="dashboard-panel"><div class="section-heading"><h2 id="tableTitle">Recent activity</h2></div><div id="dashboardTable" class="dashboard-table"></div></section><section id="sellerRequestsPanel" class="dashboard-panel seller-requests-panel" hidden><div class="section-heading"><div><p class="eyebrow">REVIEW QUEUE</p><h2>Seller requests</h2></div><span id="requestCount" class="request-count">0 pending</span></div><div id="sellerRequests" class="dashboard-table"></div></section></main><script src="/js/dashboard.js"></script></body></html>
